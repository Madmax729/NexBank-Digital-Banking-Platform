server:
  port: ${SERVER_PORT:8087}
spring:
  application:
    name: currency-service
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:RedisSecure@2024}

# Live Exchange Rate API Configuration
# Get your free API key at: https://www.exchangerate-api.com/
currency:
  api:
    key: ${EXCHANGE_RATE_API_KEY:}
    base-url: ${EXCHANGE_RATE_API_BASE_URL:https://v6.exchangerate-api.com/v6}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
